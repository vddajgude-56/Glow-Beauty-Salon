<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - Glow Beauty Salon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Book Appointment</h1>
        <p>Fill the form to confirm your slot</p>
    </div>

    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Book Appointment</a>
    </div>

    <div class="section">
        <form>
            <p>Your Name:</p>
            <input type="text" id="username" placeholder="Enter your name">

            <p>Phone Number:</p>
            <input type="text" id="userphone" placeholder="Enter phone number">
            

            <p>Select Date:</p>
            <input type="date" id="bookdate">

            <br><br>
            <button type="button" onclick="confirmBooking()">Confirm & Submit</button>
        </form>
    </div>

    <div class="footer">
        <p>Location: Navi Mumbai</p>
    </div>

    <!-- Linking JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
